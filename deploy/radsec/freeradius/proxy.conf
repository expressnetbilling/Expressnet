# The application AAA engine listens only on loopback.  The RadSec gateway
# re-encodes requests for this trusted local hop using the RadSec secret.
home_server django_radius_auth {
    type = auth
    ipaddr = 127.0.0.1
    port = 1812
    secret = ${env:RADIUS_PROXY_SHARED_SECRET}
    status_check = none
}

home_server django_radius_acct {
    type = acct
    ipaddr = 127.0.0.1
    port = 1813
    secret = ${env:RADIUS_PROXY_SHARED_SECRET}
    status_check = none
}

home_server_pool django_radius_auth_pool {
    type = fail-over
    home_server = django_radius_auth
}

home_server_pool django_radius_acct_pool {
    type = fail-over
    home_server = django_radius_acct
}

realm django_radius {
    auth_pool = django_radius_auth_pool
    acct_pool = django_radius_acct_pool
    nostrip
}
