apiVersion: apps/v1
kind: Deployment
metadata:
  name: expressnet-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: expressnet-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expressnet-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/expressnet:latest
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "billing_saas_django", "worker", "-l", "info", "--concurrency=2", "--prefetch-multiplier=1"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: billing_saas_django.Settings.production
          envFrom:
            - secretRef:
                name: expressnet-runtime
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
# Run exactly one scheduler.  Do not combine beat with scalable workers or
# scheduled billing tasks will be emitted more than once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expressnet-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: expressnet-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expressnet-beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/your-org/expressnet:latest
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "billing_saas_django", "beat", "-l", "info"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: billing_saas_django.Settings.production
          envFrom:
            - secretRef:
                name: expressnet-runtime
