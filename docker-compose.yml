x-app: &app
  build:
    context: .
    dockerfile: deploy/radius/Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: billing_saas_django.Settings.production
    # The RadSec PKI is generated once by the companion init service. The app
    # only reads it to issue router-specific client certificates.
    RADSEC_CA_CERT_FILE: /run/expressnet-radsec/ca.pem
    RADSEC_CA_KEY_FILE: /run/expressnet-radsec/ca-key.pem
  volumes:
    - radsec-pki:/run/expressnet-radsec:ro
  depends_on:
    radsec-pki:
      condition: service_completed_successfully

services:
  # Keep the public web/API service on Railway. This definition is useful for
  # local staging or a future move to a container host.
  web:
    <<: *app
    profiles: ["app"]
    command: >-
      sh -c "python manage.py collectstatic --noinput --settings=billing_saas_django.Settings.production &&
      python manage.py migrate --settings=billing_saas_django.Settings.production &&
      daphne --bind 0.0.0.0 --port 8000 billing_saas_django.asgi:application"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    profiles: ["app"]
    command: celery -A billing_saas_django worker -l info --concurrency=1

  beat:
    <<: *app
    profiles: ["app"]
    command: celery -A billing_saas_django beat -l info

  # One central RADIUS service. FreeRADIUS terminates mutually authenticated
  # RadSec on TCP 2083 and forwards to the Django AAA process over private
  # loopback UDP inside this same container.
  radius:
    build:
      context: .
      dockerfile: deploy/radsec/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: billing_saas_django.Settings.production
      RADIUS_RADSEC_LISTEN_PORT: 2083
      RADSEC_PKI_DIR: /run/expressnet-radsec
    volumes:
      - radsec-pki:/run/expressnet-radsec
    ports:
      - "2083:2083/tcp"
    depends_on:
      radsec-pki:
        condition: service_completed_successfully

  # Generates a persistent private CA and the RadSec server certificate from
  # PUBLIC_APP_URL / RAILWAY_PUBLIC_DOMAIN. It runs automatically; no PEM,
  # base64, or RADIUS host variables need to be entered for one-host Docker
  # deployments. Set RADIUS_RADSEC_HOST only when RadSec has a different name.
  radsec-pki:
    build:
      context: .
      dockerfile: deploy/radsec/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      RADSEC_PKI_DIR: /run/expressnet-radsec
    volumes:
      - radsec-pki:/run/expressnet-radsec
    command: ["/usr/local/bin/expressnet-prepare-radsec-pki"]

volumes:
  radsec-pki:
